# render.yaml — Deploy Nexus AI backend on Render
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nexusai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    disk:
      name: ml-models
      mountPath: /opt/render/project/src/../ml/models
      sizeGB: 1
